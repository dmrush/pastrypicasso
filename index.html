<!DOCTYPE html>
<!--
==================================================================================
  THE PASTRY PICASSO - MOBILE QR RESTAURANT MENU
==================================================================================

  EDITING INSTRUCTIONS:
  ---------------------
  1. RESTAURANT DATA & MENU CATEGORIES:
     Scroll down to the <script> section at the bottom of this file.
     Look for the clearly marked /* EDIT HERE */ section.
     - Edit `RESTAURANT` object to update restaurant name, tagline, address, whatsapp, etc.
     - Edit `MENU_CATEGORIES` array to adjust category names, icons, or image paths.

  2. FREE STATIC DEPLOYMENT:
     - STEP 1: Upload this repository / index.html to GitHub Pages, Netlify, or Cloudflare Pages.
     - STEP 2: Copy your newly published live website URL.
     - STEP 3: Print the QR code generated at the bottom of the page or export it using the
               "Download QR as PNG" button!
==================================================================================
-->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pastry Picasso — Digital Menu</title>
  <link rel="canonical" href="https://pastrypicasso.pages.dev/">
  <meta property="og:url" content="https://pastrypicasso.pages.dev/">
  <meta name="description" content="Pastry Picasso - We paint with ingredients and you taste the art. Explore our menu featuring Breakfast,
  Banana Bread & Pastries, Loaded Fries, Shawarma & Breadwarma, Small Chops, Burger, and Drinks.">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,600;1,700&display=swap"
    rel="stylesheet">

  <style>
    /* ==========================================================================
       1. DESIGN SYSTEM & CSS VARIABLES (PASTRY PICASSO SIGNATURE PINK THEME)
       ========================================================================== */
    :root {
      --bg-main: #FFF7FA;
      --bg-surface: #FFFFFF;
      --bg-subtle: #FCE7F3;
      --bg-card: #FFFFFF;
      --accent-primary: #E11D74;
      /* Signature Picasso Magenta Pink */
      --accent-hover: #BE185D;
      --accent-warm: #F43F5E;
      --accent-soft: #FDF2F8;
      --text-main: #1F171D;
      /* Deep Plum / Charcoal */
      --text-muted: #6E5C67;
      /* Soft Mauve Slate */
      --text-light: #9E8C96;
      --border-color: #F8D3E4;
      --border-focus: rgba(225, 29, 116, 0.45);
      --shadow-sm: 0 2px 10px rgba(225, 29, 116, 0.06);
      --shadow-md: 0 6px 24px rgba(225, 29, 116, 0.10);
      --shadow-lg: 0 14px 36px rgba(225, 29, 116, 0.16);
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-pill: 9999px;
      --font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --transition-fast: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      --transition-normal: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Reset & Base Styles */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-family);
      line-height: 1.5;
      padding-bottom: 60px;
      overflow-x: hidden;
    }

    :focus-visible {
      outline: 3px solid var(--border-focus);
      outline-offset: 2px;
    }

    .container {
      width: 100%;
      max-width: 768px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* ==========================================================================
       2. HEADER & HERO SECTION
       ========================================================================== */
    header {
      background: linear-gradient(180deg, #FFFFFF 0%, var(--bg-main) 100%);
      border-bottom: 1px solid var(--border-color);
      padding: 36px 0 26px 0;
      text-align: center;
      position: relative;
    }

    .logo-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 16px auto;
      text-align: center;
    }

    .brand-logo {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 3.5px solid var(--accent-primary);
      box-shadow: 0 8px 25px rgba(225, 29, 116, 0.28);
      background-color: #FFFFFF;
      transition: transform var(--transition-normal), box-shadow var(--transition-normal);
      display: block;
      margin: 0 auto;
    }

    .brand-logo:hover {
      transform: scale(1.04);
      box-shadow: 0 12px 30px rgba(225, 29, 116, 0.35);
    }

    .menu-header-title {
      font-size: 2.1rem;
      font-weight: 800;
      color: var(--accent-primary);
      margin: 8px 0 16px 0;
    }

    .cta-button-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 48px;
      padding: 12px 32px;
      font-size: 0.98rem;
      font-weight: 700;
      border-radius: var(--radius-pill);
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: transform var(--transition-fast), background-color var(--transition-fast), box-shadow var(--transition-fast);
      touch-action: manipulation;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-whatsapp {
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      color: #FFFFFF;
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.35);
    }

    .btn-whatsapp:hover {
      background: linear-gradient(135deg, #22BF5B 0%, #0E7468 100%);
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.45);
      transform: translateY(-2px);
    }

    .order-prep-notice {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--accent-primary);
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-color);
      padding: 6px 18px;
      border-radius: var(--radius-pill);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }

    .btn-secondary {
      background-color: var(--bg-surface);
      color: var(--accent-primary);
      border: 1.5px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }

    .btn-secondary:hover {
      background-color: var(--bg-subtle);
      border-color: var(--accent-primary);
    }

    /* ==========================================================================
       3. STICKY CATEGORY NAV
       ========================================================================== */
    .sticky-wrapper {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(255, 247, 250, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      padding: 12px 0;
    }

    .category-scroll-container {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding: 4px 2px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      justify-content: flex-start;
    }

    @media (min-width: 860px) {
      .category-scroll-container {
        justify-content: center;
      }
    }

    .category-scroll-container::-webkit-scrollbar {
      display: none;
    }

    .category-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      min-height: 44px;
      padding: 0 20px;
      font-size: 0.92rem;
      font-weight: 700;
      font-family: inherit;
      color: var(--text-muted);
      background-color: var(--bg-surface);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: all var(--transition-fast);
      touch-action: manipulation;
    }

    .category-pill:hover {
      border-color: var(--accent-primary);
      color: var(--accent-primary);
      background-color: var(--bg-subtle);
    }

    .category-pill.active {
      background-color: var(--accent-primary);
      color: #FFFFFF;
      border-color: var(--accent-primary);
      box-shadow: 0 4px 12px rgba(225, 29, 116, 0.3);
    }

    /* ==========================================================================
       4. STACKED MENU IMAGE SECTIONS
       ========================================================================== */
    main {
      padding-top: 24px;
    }

    .menu-image-section {
      scroll-margin-top: 90px;
      margin-bottom: 40px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border-color);
    }

    .section-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-subtitle {
      font-size: 0.82rem;
      color: var(--accent-primary);
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background-color: var(--bg-subtle);
      padding: 4px 12px;
      border-radius: var(--radius-pill);
    }

    .menu-image-card {
      position: relative;
      background-color: var(--bg-surface);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-md);
      transition: transform var(--transition-normal), box-shadow var(--transition-normal), border-color var(--transition-normal);
      cursor: pointer;
    }

    .menu-image-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
      border-color: var(--accent-primary);
    }

    .menu-image-card img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      background-color: #FFFFFF;
      transition: transform var(--transition-normal);
    }

    .tap-hint-overlay {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background-color: rgba(31, 23, 29, 0.85);
      color: #FFFFFF;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      box-shadow: var(--shadow-sm);
    }

    /* ==========================================================================
       5. FULL-SCREEN LIGHTBOX MODAL
       ========================================================================== */
    .lightbox-modal {
      position: fixed;
      inset: 0;
      z-index: 999;
      background-color: rgba(20, 10, 16, 0.92);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .lightbox-modal.open {
      display: flex;
      opacity: 1;
    }

    .lightbox-content-wrapper {
      position: relative;
      max-width: 96vw;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-lg);
    }

    .lightbox-caption {
      color: #FFFFFF;
      font-size: 1.05rem;
      font-weight: 700;
      margin-top: 10px;
      text-align: center;
    }

    .lightbox-close-btn {
      position: absolute;
      top: -46px;
      right: 0;
      background: rgba(225, 29, 116, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.5);
      color: #FFFFFF;
      font-size: 1.5rem;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color var(--transition-fast);
    }

    .lightbox-close-btn:hover {
      background: var(--accent-primary);
    }

    /* ==========================================================================
       6. QR CODE SECTION (SHOWN LOCALLY ONLY; HIDDEN ON HOSTED SITE)
       ========================================================================== */
    .qr-card-section {
      display: none !important;
      visibility: hidden !important;
      height: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
    }

    .qr-card-section.visible {
      display: flex !important;
      visibility: visible !important;
      height: auto !important;
      margin: 32px auto 0 auto !important;
      padding: 28px 20px !important;
      overflow: visible !important;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      background-color: var(--bg-surface);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
    }

    .qr-display-container {
      padding: 14px;
      background-color: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
    }

    .qr-url-text {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent-primary);
      word-break: break-all;
    }

    /* ==========================================================================
       7. FOOTER
       ========================================================================== */
    footer {
      margin-top: 48px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-light);
      padding-top: 24px;
      border-top: 1px solid var(--border-color);
    }
  </style>
</head>

<body>

  <!-- RESTAURANT HEADER -->
  <header>
    <div class="container">
      <div class="logo-wrapper">
        <img src="images/logo.jpg" alt="Pastry Picasso Logo" class="brand-logo">
      </div>

      <h1 class="menu-header-title">Menu List</h1>

      <div class="cta-button-group">
        <a id="btn-whatsapp" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-whatsapp">
          💬 Order on WhatsApp
        </a>
        <p class="order-prep-notice">⏱️ All orders take 30 to 40 minutes to be ready.</p>
      </div>
    </div>
  </header>

  <!-- STICKY CATEGORY PILLS NAVIGATION -->
  <div class="sticky-wrapper">
    <div class="container">
      <nav id="category-pills" class="category-scroll-container" aria-label="Menu categories">
        <!-- Rendered dynamically via JS: Breakfast, Banana Bread & Pastries, Loaded Fries, Shawarma & Breadwarma, Small Chops, Burger, Drinks -->
      </nav>
    </div>
  </div>

  <!-- MAIN STACKED MENU CONTAINER -->
  <main class="container">
    <div id="menu-sections-container">
      <!-- Image Sections rendered dynamically via JS -->
    </div>

    <!-- QR CODE GENERATOR SECTION (SHOWN LOCALLY ONLY; HIDDEN ON HOSTED SITE) -->
    <aside id="qr-section" class="qr-card-section">
      <h2 class="qr-card-title">📱 Table QR Code</h2>
      <p class="qr-card-subtitle">Scan to open this digital menu instantly on any smartphone.</p>

      <div class="qr-display-container">
        <div id="qr-canvas-holder">
          <!-- Canvas / Image rendered via JS -->
        </div>
      </div>

      <div id="qr-url-text" class="qr-url-text">https://pastrypicasso.pages.dev/</div>

      <button id="btn-download-qr" class="btn btn-secondary">
        ⬇️ Download QR as PNG
      </button>
    </aside>
  </main>

  <!-- FOOTER -->
  <footer class="container">
    <p>© <span id="year-text">2026</span> <span id="footer-res-name">Pastry Picasso</span>. All rights reserved.</p>
    <p style="margin-top: 4px;">Developed by <a href="https://dmrush.online" target="_blank" rel="noopener noreferrer"
        style="color: var(--accent-primary); font-weight: 700; text-decoration: none;">DMRush</a></p>
  </footer>

  <!-- LIGHTBOX MODAL FOR TAP-TO-ZOOM / FULL-VIEW -->
  <div id="lightbox-modal" class="lightbox-modal" role="dialog" aria-modal="true" aria-label="Expanded Menu View">
    <div class="lightbox-content-wrapper">
      <button id="lightbox-close" class="lightbox-close-btn" aria-label="Close full view">&times;</button>
      <img id="lightbox-img" class="lightbox-img" src="" alt="Menu preview">
      <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>
  </div>

  <!-- LIGHTWEIGHT STANDALONE QR CODE GENERATOR SCRIPT -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- APP ENGINE & DATA SCRIPT -->
  <script>
    /* ==========================================================================
       EDIT HERE - RESTAURANT METADATA & MENU CATEGORIES
       ========================================================================== */

    // 1. Restaurant Information
    const RESTAURANT = {
      name: "Pastry Picasso",
      url: "https://pastrypicasso.pages.dev/",
      whatsapp: "2348144363688", // WhatsApp formatted number for 08144363688
      whatsappDisplay: "08144363688",
      currency: "$"
    };

    // 2. Menu Categories & Image List
    const MENU_CATEGORIES = [
      {
        id: "breakfast",
        name: "Breakfast",
        icon: "🥞",
        image: "images/Breakfast.jpeg",
        description: "Morning platters, pancakes, waffles, combos, and fresh breakfast favorites"
      },
      {
        id: "banana-bread-and-pastries",
        name: "Banana Bread & Pastries",
        icon: "🥐",
        image: "images/Banana Bread & Pastries.jpeg",
        description: "Freshly baked banana bread varieties, meat pies, chicken pies, scotch eggs, and doughnuts"
      },
      {
        id: "loaded-fries",
        name: "Loaded Fries",
        icon: "🍟",
        image: "images/Loaded Fries.jpeg",
        description: "Crispy chicken & beef loaded fries, cheesy loaded plantain fries, classic and jumbo bowls"
      },
      {
        id: "shawarma-and-breadwarma",
        name: "Shawarma & Breadwarma",
        icon: "🌯",
        image: "images/Shawarma & Breadwarma.jpeg",
        description: "Chicken, beef, turkey & spicy suya shawarma wraps and jumbo breadwarma specials"
      },
      {
        id: "small-chops",
        name: "Small Chops",
        icon: "🥟",
        image: "images/Small Chops.jpeg",
        description: "Single party packs, platters, samosas, spring rolls, puff puff, corn dogs, and extras"
      },
      {
        id: "burger",
        name: "Burger",
        icon: "🍔",
        image: "images/Burger.jpeg",
        description: "Classic Picasso burgers, deluxe burgers, waffle burgers, double deckers, combos, and extras"
      },
      {
        id: "drinks",
        name: "Drinks",
        icon: "🍹",
        image: "images/Drinks.jpeg",
        description: "Bubble tea, milkshakes, cocktails, mocktails, and fresh yogurt drinks"
      }
    ];

    /* ==========================================================================
       APP INITIALIZATION
       ========================================================================== */

    document.addEventListener("DOMContentLoaded", () => {
      initRestaurantInfo();
      renderCategoryPills();
      renderMenuSections();
      initScrollObserver();
      initLightbox();
      initQRCode();
    });

    // Populates Header & Footer text & CTAs
    function initRestaurantInfo() {
      const footerResName = document.getElementById("footer-res-name");
      if (footerResName) footerResName.textContent = RESTAURANT.name;

      // WhatsApp CTA
      const btnWhatsapp = document.getElementById("btn-whatsapp");
      if (btnWhatsapp && RESTAURANT.whatsapp) {
        const message = encodeURIComponent(`Hello ${RESTAURANT.name}! I am viewing your digital menu and would like to place an order.`);
        btnWhatsapp.href = `https://wa.me/${RESTAURANT.whatsapp}?text=${message}`;
      } else if (btnWhatsapp) {
        btnWhatsapp.style.display = "none";
      }

      const yearText = document.getElementById("year-text");
      if (yearText) yearText.textContent = new Date().getFullYear();
    }

    // Renders sticky navigation category pills
    function renderCategoryPills() {
      const container = document.getElementById("category-pills");
      container.innerHTML = "";

      MENU_CATEGORIES.forEach((cat, index) => {
        const button = document.createElement("button");
        button.className = `category-pill ${index === 0 ? "active" : ""}`;
        button.setAttribute("data-category", cat.id);
        button.innerHTML = `<span>${cat.icon || "🍽️"}</span> ${cat.name}`;

        button.addEventListener("click", () => {
          document.querySelectorAll(".category-pill").forEach(p => p.classList.remove("active"));
          button.classList.add("active");

          const section = document.getElementById(`section-${cat.id}`);
          if (section) {
            section.scrollIntoView({ behavior: "smooth" });
          }
        });

        container.appendChild(button);
      });
    }

    // Renders stacked image sections
    function renderMenuSections() {
      const container = document.getElementById("menu-sections-container");
      container.innerHTML = "";

      MENU_CATEGORIES.forEach(cat => {
        const section = document.createElement("section");
        section.id = `section-${cat.id}`;
        section.className = "menu-image-section";

        section.innerHTML = `
          <div class="section-header">
            <h2 class="section-title">
              <span>${cat.icon || "🍽️"}</span> ${cat.name}
            </h2>
            <span class="section-subtitle">🔍 Tap image to zoom</span>
          </div>
          <div class="menu-image-card" data-img-src="${cat.image}" data-img-title="${cat.name} Menu">
            <img src="${cat.image}" alt="${cat.name} Menu" loading="lazy">
            <div class="tap-hint-overlay">
              <span>🔍 Tap to expand</span>
            </div>
          </div>
        `;

        container.appendChild(section);
      });
    }

    // Scroll Observer for Category Pills
    function initScrollObserver() {
      const observerOptions = {
        root: null,
        rootMargin: "-100px 0px -50% 0px",
        threshold: 0.1
      };

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const categoryId = entry.target.id.replace("section-", "");
            const activePill = document.querySelector(`.category-pill[data-category="${categoryId}"]`);

            if (activePill) {
              document.querySelectorAll(".category-pill").forEach(p => p.classList.remove("active"));
              activePill.classList.add("active");
              activePill.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
            }
          }
        });
      }, observerOptions);

      setTimeout(() => {
        document.querySelectorAll(".menu-image-section").forEach(section => {
          observer.observe(section);
        });
      }, 100);
    }

    // Lightbox modal for zooming into menu images
    function initLightbox() {
      const modal = document.getElementById("lightbox-modal");
      const modalImg = document.getElementById("lightbox-img");
      const modalCaption = document.getElementById("lightbox-caption");
      const closeBtn = document.getElementById("lightbox-close");

      // Attach click events on menu image cards
      document.addEventListener("click", (e) => {
        const card = e.target.closest(".menu-image-card");
        if (card) {
          const imgSrc = card.getAttribute("data-img-src");
          const imgTitle = card.getAttribute("data-img-title");

          modalImg.src = imgSrc;
          modalCaption.textContent = imgTitle;
          modal.classList.add("open");
          document.body.style.overflow = "hidden";
        }
      });

      function closeModal() {
        modal.classList.remove("open");
        document.body.style.overflow = "";
        modalImg.src = "";
      }

      closeBtn.addEventListener("click", closeModal);
      modal.addEventListener("click", (e) => {
        if (e.target === modal) {
          closeModal();
        }
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && modal.classList.contains("open")) {
          closeModal();
        }
      });
    }

    // QR Code Generator & PNG Download Export (shown locally only; hidden on hosted site)
    function initQRCode() {
      const isLocal =
        window.location.protocol === "file:" ||
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1" ||
        window.location.hostname === "::1";

      const qrSection = document.getElementById("qr-section");
      if (!isLocal || !qrSection) return;

      const targetUrl = RESTAURANT.url || window.location.href;
      const urlText = document.getElementById("qr-url-text");
      const holder = document.getElementById("qr-canvas-holder");
      const downloadBtn = document.getElementById("btn-download-qr");

      if (!holder) return;

      qrSection.classList.add("visible");

      if (urlText) {
        urlText.textContent = targetUrl;
      }

      holder.innerHTML = "";

      if (typeof QRCode !== "undefined") {
        new QRCode(holder, {
          text: targetUrl,
          width: 200,
          height: 200,
          colorDark: "#1F171D",
          colorLight: "#FFFFFF",
          correctLevel: QRCode.CorrectLevel.H
        });
      }

      if (downloadBtn) {
        downloadBtn.addEventListener("click", () => {
          const canvas = holder.querySelector("canvas");
          const img = holder.querySelector("img");
          const dataUrl = canvas ? canvas.toDataURL("image/png") : (img && img.src ? img.src : "");

          if (dataUrl) {
            const a = document.createElement("a");
            a.href = dataUrl;
            a.download = `${RESTAURANT.name.toLowerCase().replace(/[^a-z0-9]/g, "-")}-qr.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          } else {
            alert("QR Code is generating... please try again in a moment.");
          }
        });
      }
    }
  </script>
